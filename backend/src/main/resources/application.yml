spring:
  application:
    name: creditbook
  # 접속 정보는 여기 두지 않는다 (CLAUDE.md 절대 금지 #5).
  # 로컬: backend/application-local.yml (gitignore) / 배포: SPRING_DATASOURCE_URL·USERNAME·PASSWORD 환경변수
  datasource:
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway만 바꾼다
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

creditbook:
  charge:
    max-amount: 300000   # 1회 충전 한도 (잔액 상한 아님)
  memo:
    presets: [음료, 베이커리, 원두, 디저트, MD, 기타]

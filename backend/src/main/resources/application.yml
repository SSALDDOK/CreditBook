spring:
  application:
    name: creditbook
  # 접속 정보는 여기 두지 않는다 (CLAUDE.md 절대 금지 #5).
  # 로컬: backend/application-local.yml (gitignore) / 배포: SPRING_DATASOURCE_URL·USERNAME·PASSWORD 환경변수
  datasource:
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway만 바꾼다
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      # 요청 본문에 받지 않는 항목(balance·active 등)이 있으면 무시하지 않고 400 INVALID_INPUT (REQ-27)
      fail-on-unknown-properties: true

server:
  # 배포처(Render)가 PORT 환경변수로 포트를 정한다. 없으면 8080
  port: ${PORT:8080}
  # 프록시(Render 등) 뒤에서 클라이언트 IP 를 바로잡는다. Tomcat RemoteIpValve 가 내부 프록시 주소에서 온 X-Forwarded-For 만 믿고
  # request.getRemoteAddr() 를 바꾼다 — 로그인 레이트 리밋은 이 값만 쓴다 (X-Forwarded-For 를 직접 읽으면 위조할 수 있다)
  forward-headers-strategy: native

logging:
  pattern:
    # 모든 로그 라인에 요청 correlation id (RequestIdFilter 가 MDC requestId 에 넣는다). 요청 밖 로그는 rid= 가 빈 값.
    # Boot 기본 콘솔·파일 패턴의 LOG_CORRELATION_PATTERN 자리에 들어가므로 나머지 형식은 기본값 그대로다
    correlation: "[rid=%X{requestId:-}] "

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

creditbook:
  auth:
    # HS256 서명 키. 환경변수로만 받는다 — 값을 이 파일이나 application-local*.yml 에 쓰지 않는다 (절대 금지 #5).
    # 없거나 32바이트 미만이면 기동이 실패한다. 설정 방법은 docs/dev-environment-guide.md
    jwt-secret: ${CREDITBOOK_JWT_SECRET:}
    token-ttl: 16h       # 로그인 유지 시간 (쿠키 Max-Age 와 같음). 갱신 토큰 없음
    # 로그인 잠금 (REQ-15): 있는 계정이 연속으로 max-failures 번 틀리면 duration 동안 잠근다(늘리지 않음). 잠긴 동안은 맞아도 423
    login-lock:
      max-failures: 5
      duration: 5m
    # 로그인 IP 레이트 리밋 (REQ-15): 같은 IP 의 POST /api/auth/login 을 window 고정 창마다 max-requests 번까지 받고 넘으면 429.
    # 환경변수 CREDITBOOK_AUTH_LOGINRATELIMIT_MAXREQUESTS 로 덮을 수 있다 — CI E2E 처럼 한 IP 에서 로그인을 많이 하는 실행만 올린다
    login-rate-limit:
      max-requests: 10
      window: 1m
  cors:
    allowed-origins: []  # 같은 출처(프록시) 배포면 비워 둔다. '*' 는 기동 실패
  charge:
    max-amount: 300000   # 1회 충전 한도 (잔액 상한 아님)
  memo:
    presets: [음료, 베이커리, 원두, 디저트, MD, 기타]          # 사용(USE) 메모 문구 칩
    charge-presets: [현금, 카드, 계좌이체]                     # 충전(CHARGE) 메모 문구 칩
  # 영업 시간대. 충전 취소의 '당일'(REQ-7)을 이 시간대의 달력 날짜로 판단한다 — 서버·DB 시각은 UTC 다.
  # 잘못된 시간대 ID 면 기동이 실패한다
  business-zone: Asia/Seoul
